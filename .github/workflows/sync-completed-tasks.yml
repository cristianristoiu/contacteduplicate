name: Sincronizare taskuri finalizate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-completed-tasks.yml

permissions:
  contents: write

jobs:
  sync-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 200

      - name: Sincronizeaza planul
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          messages = subprocess.check_output(
              ['git', 'log', '-200', '--format=%s'],
              text=True,
          )
          numbers = [
              int(value)
              for line in messages.splitlines()
              for value in re.findall(r'\b[A-Z]{3}(\d{4,})', line)
          ]
          if max(numbers, default=-1) != 120:
              raise RuntimeError('Numerotarea globala nu este CHT0120')

          tasks = (
              ('Creare Widget `InfoBox`: Mesaje Informative de Tip Callout.', 'CHT0113'),
              ('Rafinare Splash Screen: Animații Secvențiale Complexe.', 'CHT0114'),
              ('Implementare `AppDialog`: Fundație pentru Ferestre Modale.', 'CHT0115'),
              ('Creare `ConfirmationDialog`: Dialoguri de Decizie Standardizate.', 'CHT0116'),
              ('Implementare `AppBottomSheet`: Panouri Glisante de Jos.', 'CHT0117'),
              ('Creare `SelectionListTile`: Selecție Granulară în Liste.', 'CHT0118'),
              ('Adăugare Suport pentru "Haptic Feedback": Răspuns Tactil.', 'CHT0119'),
          )

          plan = Path('docs/implementation-plan.md')
          lines = plan.read_text(encoding='utf-8').splitlines()
          for marker, code in tasks:
              matches = [index for index, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise RuntimeError(
                      f'Markerul {marker!r} trebuie sa apara o data; aparitii: {len(matches)}'
                  )
              index = matches[0]
              stripped = lines[index].lstrip()
              indentation = lines[index][:-len(stripped)]
              if stripped.startswith('- ~~'):
                  if not stripped.endswith(f'({code})'):
                      raise RuntimeError(f'Task finalizat cu alt cod: {stripped}')
                  continue
              if not stripped.startswith('- '):
                  raise RuntimeError(f'Format invalid: {stripped}')
              lines[index] = f'{indentation}- ~~{stripped[2:]}~~ ({code})'

          plan.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/sync-completed-tasks.yml').unlink()

      - name: Publica planul
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation-plan.md .github/workflows/sync-completed-tasks.yml
          git commit -m 'CHT0120 - Corectie: Sincronizeaza planul de implementare'
          git push origin HEAD:main
