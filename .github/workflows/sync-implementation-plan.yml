name: Sincronizare temporara plan implementare

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-implementation-plan.yml

permissions:
  contents: write

jobs:
  sync-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Preia repository-ul
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 200

      - name: Verifica numerotarea globala
        shell: bash
        run: |
          set -euo pipefail
          max_code="$({ git log -200 --format='%s' || true; } | python3 -c 'import re, sys; values = [int(value) for line in sys.stdin for value in re.findall(r"\b[A-Z]{3}(\d{4,})", line)]; print(max(values) if values else -1)')"
          test "$max_code" = "112"

      - name: Marcheaza taskurile confirmate
        shell: python
        run: |
          from pathlib import Path

          plan_path = Path('docs/implementation-plan.md')
          lines = plan_path.read_text(encoding='utf-8').splitlines()

          tasks = (
              ('Creare Widget `ProgressRing`: Desenare Custom cu `CustomPainter`.', 'CHT0108'),
              ('Creare Widget `ProgressRing`: Animație și Text Central.', 'CHT0109'),
              ('Adăugare Suport pentru Gradienți în `AppCard`.', 'CHT0110'),
              ('Implementare Sistem de Umbre: `AppBoxShadows`.', 'CHT0111'),
          )

          for marker, commit_code in tasks:
              matches = [index for index, line in enumerate(lines) if marker in line]
              if len(matches) != 1:
                  raise RuntimeError(
                      f'Markerul {marker!r} trebuie sa apara exact o data; aparitii: {len(matches)}'
                  )

              index = matches[0]
              line = lines[index]
              indentation = line[:len(line) - len(line.lstrip())]
              stripped = line.lstrip()

              if stripped.startswith('- ~~'):
                  if not stripped.endswith(f'({commit_code})'):
                      raise RuntimeError(
                          f'Taskul {marker!r} este deja finalizat cu alt cod: {stripped}'
                      )
                  continue

              if not stripped.startswith('- '):
                  raise RuntimeError(f'Format neasteptat pentru taskul {marker!r}: {stripped}')

              lines[index] = f'{indentation}- ~~{stripped[2:]}~~ ({commit_code})'

          plan_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Verifica si publica planul
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code --quiet docs/implementation-plan.md && {
            echo 'Planul era deja sincronizat.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation-plan.md
          git commit -m 'CHT0112 - Corectie: Sincronizeaza planul de implementare'
          git push origin HEAD:main
